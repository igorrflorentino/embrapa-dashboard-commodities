# Monthly nudge to consider a manual `reconcile`. We deliberately do NOT run
# reconcile on a schedule — but the issue now points at `embrapa reconcile-check`,
# which ANSWERS the question with a measurement instead of asking for a guess.
# (The original reasoning was that no cheap pre-check was feasible for IBGE/BCB —
# detecting whether an OLD year
# was revised costs about the same as re-fetching it — and COMEX already re-detects
# old-year revisions every night via its per-file ETag check. So reconcile is
# operator-triggered (`make reconcile`); this workflow only opens a monthly
# reminder issue assigned to the repo owner (→ a GitHub notification e-mail).
name: reconcile reminder

on:
  schedule:
    - cron: '0 12 1 * *'   # 1st of the month, 12:00 UTC (09:00 BRT)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  remind:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Open the monthly reconcile-reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          body_file="$(mktemp)"
          cat > "$body_file" <<'EOF'
          **Monthly nudge — do we need a `reconcile` this month?**

          `reconcile` fully re-downloads every nightly source (ignoring the
          delta/ETag short-circuit) to catch upstream revisions to **OLD years**
          the nightly delta never re-queries.

          **When it is actually warranted** — only if **IBGE (PEVS/PAM)** or **BCB**
          published a revision to a year *older* than the nightly delta window.
          COMEX already re-detects old-year revisions every night via its per-file
          ETag check, so `reconcile` does nothing extra for it. Old-year revisions
          in IBGE/BCB are rare.

          **Don't guess — measure.** Run the check first:

          ```bash
          uv run embrapa reconcile-check
          ```

          It compares what the sources serve TODAY against what Bronze holds, for data
          old enough that the delta window never touches it: IBGE PEVS cell by cell at
          the grain we store (município × produto × variável), and every BCB point older
          than the rewind window. Read-only — it never ingests or fixes anything. It
          exits 1 if anything diverged, 0 if not, and prints how many points it compared.

          **If it reports divergences**, re-ingest and rebuild:

          ```bash
          make reconcile          # full re-ingest of Bronze, then a prod dbt build
          ```

          **If it comes back clean:** paste the numbers here and close the issue.

          ---
          _Why a reminder instead of a scheduled job: `reconcile` itself is expensive and
          rarely warranted, so it stays operator-triggered. The old reasoning also held
          that no cheap pre-check was possible — `reconcile-check` disproved that for a
          well-chosen sample (~20k points in a couple of minutes), which is why this issue
          now leads with it. Re-enable the old monthly scheduler any time with
          `make ingest-job-reconcile-schedule`._
          EOF
          gh issue create \
            --repo "$REPO" \
            --title "🔄 Reconcile check — $(date -u +'%Y-%m')" \
            --assignee "$OWNER" \
            --body-file "$body_file"
